<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.I CHAMGADAR // INTRUDER RADAR SCANNER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b060d;
            --accent-color: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.4);
            --success-color: #00ffcc;
            --success-glow: rgba(0, 255, 204, 0.4);
            --text-color: #f3e8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .crt {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.85) 100%);
            z-index: 9998;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 30px;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            width: 100%;
            max-width: 750px;
            background: rgba(18, 10, 25, 0.85);
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.5s ease;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 85, 0.3);
            padding-bottom: 10px;
            color: var(--accent-color);
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .console-output {
            min-height: 250px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-color);
        }

        .console-line {
            opacity: 0;
            transform: translateY(5px);
            animation: showLine 0.4s forwards;
        }

        @keyframes showLine {
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-action {
            display: inline-block;
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 24px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.1);
        }

        .btn-action:hover {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-color);
            text-shadow: 0 0 5px #fff;
        }

        .red-alert {
            animation: screenFlicker 0.1s infinite alternate;
        }

        @keyframes screenFlicker {
            0% { background-color: rgba(255, 0, 85, 0.05); }
            100% { background-color: rgba(255, 0, 85, 0.15); }
        }

        .scan-bar {
            width: 100%;
            height: 4px;
            background: var(--accent-color);
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 0 0 10px var(--accent-color);
            animation: scanMove 4s infinite linear;
            z-index: 100;
            display: none;
        }

        @keyframes scanMove {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Fake Screen Off Animation Overlay */
        .shutdown-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 100000;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .crt-collapse {
            animation: collapseAnim 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            background: #fff;
            width: 100%;
            height: 100%;
            position: absolute;
        }

        @keyframes collapseAnim {
            0% { transform: scaleY(1) scaleX(1); filter: brightness(1); }
            45% { transform: scaleY(0.004) scaleX(1.1); filter: brightness(4); }
            75% { transform: scaleY(0.004) scaleX(0.004); filter: brightness(6); }
            100% { transform: scaleY(0) scaleX(0); filter: brightness(0); }
        }

        .phosphor-dot {
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 4px #fff, 0 0 30px 10px var(--accent-color);
            opacity: 0;
            position: relative;
            z-index: 10;
        }

        .fade-phosphor {
            animation: phosphorAnim 9.5s ease-out forwards;
        }

        @keyframes phosphorAnim {
            0% { opacity: 0; }
            8% { opacity: 1; transform: scale(1.5); }
            20% { opacity: 0.8; transform: scale(1); }
            80% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(0); }
        }

        .shutdown-timer-text {
            position: absolute;
            bottom: 30px;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="crt"></div>
    <div class="scan-bar" id="scanBar"></div>

    <!-- Shutdown screen overlay -->
    <div class="shutdown-screen" id="shutdownScreen">
        <div class="crt-collapse" id="crtCollapse"></div>
        <div class="phosphor-dot" id="phosphorDot"></div>
        <div class="shutdown-timer-text" id="shutdownTimer">SYSTEM OFFLINE. AUTO-BACK IN 10S</div>
    </div>

    <div class="container" id="mainContainer">
        <div class="terminal">
            <div class="terminal-header">
                <span>🛡️ INTRUDER RADAR SCANNER v2.1</span>
                <div class="status-dot"></div>
            </div>
            <div class="console-output" id="console">
                <p class="console-line">> SYSTEM STATE: IDLE</p>
                <p class="console-line">> READY FOR RADAR DOX SCAN PROTOCOL</p>
                <br>
                <p class="console-line" style="color: var(--success-color);">[WARNING] THIS PROGRAM WILL DECRYPT DATA NODES AND AUTO-ABORT UPON COMPLETION</p>
            </div>
            <div style="text-align: center; margin-top: 15px;" id="actionBlock">
                <button class="btn-action" id="startBtn" onclick="runPrank()">INITIALIZE ENCRYPTION SCAN</button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer Class
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playClick() {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playTick() {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400 + Math.random() * 300, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.03);
                osc.start(); osc.stop(this.ctx.currentTime + 0.03);
            }
            playAlarm(duration = 2.0) {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                for(let t = 0; t < duration; t += 0.4) {
                    osc.frequency.setValueAtTime(800, now + t);
                    osc.frequency.setValueAtTime(500, now + t + 0.2);
                }
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.start(); osc.stop(now + duration);
            }
            playCRT() {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc.start(); osc.stop(now + 0.8);
            }
        }
        const sfx = new SoundEffects();

        async function runPrank() {
            sfx.playClick();
            const btn = document.getElementById('startBtn');
            const con = document.getElementById('console');
            const scanBar = document.getElementById('scanBar');
            const container = document.getElementById('mainContainer');
            
            btn.style.display = 'none';
            scanBar.style.display = 'block';
            container.classList.add('red-alert');

            con.innerHTML = "";
            
            const addLine = (text, color = 'var(--text-color)', delay = 400) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        sfx.playTick();
                        const p = document.createElement('p');
                        p.className = 'console-line';
                        p.style.color = color;
                        p.innerHTML = text;
                        con.appendChild(p);
                        con.scrollTop = con.scrollHeight;
                        resolve();
                    }, delay);
                });
            };

            await addLine("> CONNECTING TO RADAR CENTRAL...", 'var(--accent-color)', 200);
            await addLine("> PINNING INT INTRUSION PORTS...", 'var(--text-color)', 300);
            await addLine("> DECRYPTING TARGET SIGNATURE...", 'var(--text-color)', 250);
            
            const ua = navigator.userAgent;
            let browser = "Unknown Browser";
            if(ua.includes("Chrome")) browser = "Google Chrome Engine";
            else if(ua.includes("Firefox")) browser = "Mozilla Firefox Core";
            else if(ua.includes("Safari") && !ua.includes("Chrome")) browser = "Apple Safari Core";
            else if(ua.includes("Edge")) browser = "Microsoft Edge Core";
            
            let os = "Unknown OS";
            if(ua.includes("Windows")) os = "Windows OS";
            else if(ua.includes("Macintosh")) os = "macOS Platform";
            else if(ua.includes("Linux")) os = "Linux Machine";
            else if(ua.includes("Android")) os = "Android Mobile";
            else if(ua.includes("iPhone")) os = "Apple iPhone iOS";

            await addLine(`> TARGET OS DETECTED: ${os} (${browser})`, 'var(--success-color)', 400);
            await addLine(`> CLIENT RESOLUTION: ${screen.width}x${screen.height} @ ${screen.colorDepth}-bit`, 'var(--text-color)', 300);
            await addLine(`> CLIENT LANGUAGE: ${navigator.language || 'en-US'}`, 'var(--text-color)', 200);
            await addLine(`> LOGICAL CPU THREADS: ${navigator.hardwareConcurrency || 8} Threads`, 'var(--success-color)', 300);
            
            const time = new Date().toLocaleTimeString();
            const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            await addLine(`> CLIENT TIME: ${time} (ZONE: ${zone})`, 'var(--text-color)', 300);

            // Battery details if available
            try {
                if(navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    const batLevel = Math.round(bat.level * 100);
                    const isCharging = bat.charging ? "CHARGING" : "DISCHARGING";
                    await addLine(`> DEVICE CELL STATUS: ${batLevel}% (${isCharging})`, 'var(--success-color)', 300);
                }
            } catch(e) {}

            // Try to fetch IP and location details
            await addLine("> REQUESTING DNS GEOLOCATION BYPASS...", 'var(--accent-color)', 400);
            
            let ipData = null;
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    ipData = await res.json();
                }
            } catch(e) {}

            if(ipData) {
                await addLine(`> PUBLIC IP PINPOINTED: ${ipData.ip}`, 'var(--accent-color)', 500);
                await addLine(`> ADDRESS: ${ipData.city}, ${ipData.region}, ${ipData.country_name} (${ipData.postal})`, 'var(--success-color)', 450);
                await addLine(`> COORDINATES (LAT/LON): ${ipData.latitude} / ${ipData.longitude}`, 'var(--text-color)', 350);
                await addLine(`> ISP PROVIDER ORGANISATION: ${ipData.org}`, 'var(--text-color)', 350);
                await addLine(`> COUNTRY CALLING CODE: ${ipData.country_calling_code}`, 'var(--text-color)', 300);
                await addLine(`> CURRENCY: ${ipData.currency_name} (${ipData.currency})`, 'var(--text-color)', 250);
            } else {
                await addLine("> PUBLIC IP PINPOINTED: 192.168.1.104 (ROUTER ROOT)", 'var(--accent-color)', 500);
                await addLine("> DNS LOCATION: PATNA, BIHAR, INDIA", 'var(--success-color)', 450);
                await addLine("> ISP NETWORK: BHARTI AIRTEL BROADBAND", 'var(--text-color)', 350);
            }

            await addLine("<br>", 'var(--text-color)', 200);
            sfx.playAlarm(2.5);
            await addLine("⚠️ TARGET COMPROMISED. READ TIME PROTOCOL RUNNING (10S)... ⚠️", 'var(--accent-color)', 1000);
            
            // Wait 10 seconds for user to read before trigger shutdown
            let readTimeLeft = 10;
            const readInterval = setInterval(() => {
                readTimeLeft--;
                const lines = con.querySelectorAll('.console-line');
                const lastLine = lines[lines.length - 1];
                lastLine.innerText = `⚠️ TARGET COMPROMISED. READ TIME PROTOCOL RUNNING (${readTimeLeft}S)... ⚠️`;
                
                if(readTimeLeft <= 0) {
                    clearInterval(readInterval);
                    triggerScreenOff();
                }
            }, 1000);
        }

        function triggerScreenOff() {
            sfx.playCRT();
            const screen = document.getElementById('shutdownScreen');
            const collapse = document.getElementById('crtCollapse');
            const phosphor = document.getElementById('phosphorDot');
            const timer = document.getElementById('shutdownTimer');
            
            screen.style.display = 'flex';
            
            // Wait for collapse to finish (0.8s) before starting phosphor dot animation
            setTimeout(() => {
                collapse.style.display = 'none';
                phosphor.classList.add('fade-phosphor');
            }, 800);

            let timeLeft = 10;
            const timerInterval = setInterval(() => {
                timeLeft--;
                timer.innerText = `SYSTEM OFFLINE. AUTO-BACK IN ${timeLeft}S`;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    history.back();
                }
            }, 1000);
        }
    </script>
</body>
</html>
