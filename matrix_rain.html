<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.I CHAMGADAR // MATRIX RAIN TERMINAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: #000;
            color: #00ff66;
            font-family: 'JetBrains Mono', monospace;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
        }

        .crt {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.85) 100%);
            z-index: 1000;
            pointer-events: none;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .terminal-header {
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ff66;
        }

        .output-area {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            padding-right: 10px;
        }

        .input-line {
            display: flex;
            align-items: center;
            font-size: 1rem;
            border-top: 1px solid rgba(0, 255, 102, 0.2);
            padding-top: 10px;
        }

        .prompt {
            color: #00ff66;
            margin-right: 10px;
            text-shadow: 0 0 5px #00ff66;
            font-weight: bold;
        }

        .cmd-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            flex: 1;
            caret-color: #00ff66;
            text-shadow: 0 0 3px #fff;
        }
    </style>
</head>
<body>
    <div class="crt"></div>
    <canvas id="matrixCanvas"></canvas>

    <div class="terminal-container">
        <div class="terminal-header">
            <span>💻 A.I CHAMGADAR // MATRIX SHELL v1.2</span>
            <span>SYSTEM STATE: SAFE</span>
        </div>

        <div class="output-area" id="output">
            <p>> CONNECTING TO MATRIX SUB-CORE RUNTIME...</p>
            <p>> CONNECTED SECURELY.</p>
            <p>> TYPE <span style="color: #fff; text-shadow: 0 0 3px #fff;">help</span> FOR LIST OF COMMANDS.</p>
            <br>
        </div>

        <div class="input-line">
            <span class="prompt">guest@chamgadar:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" />
        </div>
    </div>

    <script>
        // Matrix rain effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$#@%&*+-/[]{}()";
        const fontSize = 16;
        const columns = width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const drawMatrix = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Interactive Terminal Commands
        const input = document.getElementById('cmdInput');
        const output = document.getElementById('output');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim().toLowerCase();
                input.value = "";
                executeCommand(val);
            }
        });

        function printLine(text, color = '#00ff66') {
            const p = document.createElement('p');
            p.style.color = color;
            p.innerHTML = text;
            output.appendChild(p);
            output.scrollTop = output.scrollHeight;
        }

        async function executeCommand(cmd) {
            printLine(`guest@chamgadar:~# ${cmd}`, '#fff');
            
            if (cmd === 'help') {
                printLine("Available commands:");
                printLine("  <span style='color: #fff;'>help</span>     - Display help commands");
                printLine("  <span style='color: #fff;'>scan</span>     - Geolocation and port scan target connection details");
                printLine("  <span style='color: #fff;'>srh</span>      - Launch Sunrisers Hyderabad Orange Army anthem");
                printLine("  <span style='color: #fff;'>system</span>   - Inspect Chamgadar AI system architecture status");
                printLine("  <span style='color: #fff;'>clear</span>    - Clear terminal shell output screen");
            } 
            else if (cmd === 'clear') {
                output.innerHTML = "";
            } 
            else if (cmd === 'system') {
                printLine("> INITIALIZING CORE ARCHITECTURE READOUT...", '#00ff66');
                printLine("  - A.I CHAMGADAR RUNTIME: ONLINE");
                printLine("  - COGNITIVE NEURAL LINK: DEPLOYED");
                printLine("  - SIMULATORS INTEGRITY: 100% SECURE");
            } 
            else if (cmd === 'srh') {
                printLine("🧡 SUNRISERS HYDERABAD - RISE UP! 🧡", '#ff5500');
                printLine("📢 ORANGE ARMY SQUAD ANTHEM:", '#ff5500');
                printLine("   We are the Sunrisers Hyderabad, playing with pride and passion!", '#ffebe0');
                printLine("   Rising up to conquer the playground of dreams!", '#ffebe0');
            } 
            else if (cmd === 'scan') {
                printLine("> INITIATING RADAR ENDPOINT ANALYSIS...", '#00ff66');
                const ua = navigator.userAgent;
                let os = "Unknown OS";
                if(ua.includes("Windows")) os = "Windows OS";
                else if(ua.includes("Mac")) os = "macOS Platform";
                else if(ua.includes("Android")) os = "Android Mobile";
                else if(ua.includes("iPhone")) os = "iPhone Device";
                
                printLine(`  - TARGET OS: ${os}`);
                printLine(`  - CONNECTION: ${navigator.onLine ? 'ONLINE' : 'OFFLINE'}`);
                printLine(`  - CLIENT CLOCK: ${new Date().toLocaleTimeString()}`);
                
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    if (res.ok) {
                        const data = await res.json();
                        printLine(`  - IP ADDRESS: ${data.ip}`, '#ff0055');
                        printLine(`  - LOCATION: ${data.city}, ${data.region}, ${data.country_name}`, '#00ffcc');
                        printLine(`  - ISP: ${data.org}`);
                    }
                } catch(e) {
                    printLine("  - IP ADDRESS: 192.168.1.104 (DNS ROOT PASS)");
                    printLine("  - LOCATION: PATNA, BIHAR, INDIA");
                }
            } 
            else if (cmd === "") {
                // Do nothing
            } 
            else {
                printLine(`Command not found: ${cmd}. Type 'help' for available commands.`, '#ff0055');
            }
        }
    </script>
</body>
</html>
