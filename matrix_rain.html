<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.I CHAMGADAR // MATRIX RAIN TERMINAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: #000;
            color: #00ff66;
            font-family: 'JetBrains Mono', monospace;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
        }

        .crt {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.85) 100%);
            z-index: 1000;
            pointer-events: none;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .terminal-header {
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ff66;
        }

        .output-area {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            padding-right: 10px;
        }

        .input-line {
            display: flex;
            align-items: center;
            font-size: 1rem;
            border-top: 1px solid rgba(0, 255, 102, 0.2);
            padding-top: 10px;
        }

        .prompt {
            color: #00ff66;
            margin-right: 10px;
            text-shadow: 0 0 5px #00ff66;
            font-weight: bold;
        }

        .cmd-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            flex: 1;
            caret-color: #00ff66;
            text-shadow: 0 0 3px #fff;
        }

        .btn-exit:hover {
            background: #ff0055 !important;
            color: #000 !important;
            box-shadow: 0 0 15px #ff0055 !important;
            text-shadow: none !important;
        }

        .flash-red {
            animation: redAlert 0.4s infinite alternate;
        }

        @keyframes redAlert {
            from { background-color: #000; }
            to { background-color: #1a0006; }
        }

        /* Hacker-style System Meltdown screen overlay */
        .shutdown-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 100000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff0055;
            padding: 40px;
            font-family: inherit;
        }

        .meltdown-box {
            width: 100%;
            max-width: 700px;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            background: rgba(10, 0, 5, 0.9);
            padding: 30px;
            border-radius: 8px;
            text-align: left;
            line-height: 1.6;
        }

        .meltdown-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .meltdown-code-scroll {
            height: 200px;
            overflow-y: hidden;
            font-size: 0.85rem;
            color: #ff99bb;
            border: 1px solid rgba(255, 0, 85, 0.2);
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .crt-collapse {
            animation: collapseAnim 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            background: #fff;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 100005;
            display: none;
        }

        @keyframes collapseAnim {
            0% { transform: scaleY(1) scaleX(1); filter: brightness(1); }
            45% { transform: scaleY(0.004) scaleX(1.1); filter: brightness(4); }
            75% { transform: scaleY(0.004) scaleX(0.004); filter: brightness(6); }
            100% { transform: scaleY(0) scaleX(0); filter: brightness(0); }
        }

        .phosphor-dot {
            width: 5px; height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 4px #fff, 0 0 30px 10px #ff0055;
            opacity: 0;
            position: absolute;
            z-index: 100006;
        }

        .fade-phosphor {
            animation: phosphorAnim 9.5s ease-out forwards;
        }

        @keyframes phosphorAnim {
            0% { opacity: 0; }
            8% { opacity: 1; transform: scale(1.5); }
            20% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .terminal-off-state {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 100010;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff66;
            font-size: 1rem;
            padding: 30px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #00ff66;
            margin-left: 5px;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="crt"></div>
    <canvas id="matrixCanvas"></canvas>

    <!-- Hacker System Meltdown Screen Overlay -->
    <div class="shutdown-screen" id="shutdownScreen">
        <div class="meltdown-box">
            <div class="meltdown-title">⚠️ SYSTEM MELTDOWN INITIALIZED ⚠️</div>
            <div class="meltdown-code-scroll" id="meltdownScroll">
                <!-- Hacking lines scroll -->
            </div>
            <p style="text-align: center; font-weight: bold; color: #ff3377;" id="countdownMsg">
                ERASING FILE CACHE NODES... SHUTDOWN IN 10S
            </p>
        </div>
    </div>

    <!-- CRT collapse and TV off state -->
    <div class="crt-collapse" id="crtCollapse"></div>
    <div class="phosphor-dot" id="phosphorDot"></div>
    <div class="terminal-off-state" id="terminalOffState">
        <div style="text-align: left; max-width: 600px; line-height: 1.8;">
            <p id="typerText1"></p>
            <p id="typerText2"></p>
            <p id="typerText3"><span class="cursor"></span></p>
        </div>
    </div>

    <div class="terminal-container">
        <div class="terminal-header">
            <span>💻 A.I CHAMGADAR // MATRIX SHELL v2.1</span>
            <span style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 0.85rem; opacity: 0.85;">SYSTEM STATE: ACTIVE</span>
                <button onclick="triggerSelfDestruct()" class="btn-exit" style="background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 2px 8px; cursor: pointer; font-family: inherit; font-size: 0.75rem; font-weight: bold; border-radius: 4px; text-shadow: 0 0 5px #ff0055; box-shadow: 0 0 8px rgba(255,0,85,0.2); transition: all 0.3s ease;">[ EXIT_SHELL ]</button>
            </span>
        </div>

        <div class="output-area" id="output">
            <p>> CONNECTING TO MATRIX SUB-CORE RUNTIME...</p>
            <p>> CONNECTED SECURELY.</p>
            <p>> TYPE <span style="color: #fff; text-shadow: 0 0 3px #fff;">help</span> FOR LIST OF COMMANDS.</p>
            <br>
        </div>

        <div class="input-line">
            <span class="prompt">guest@chamgadar:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" />
        </div>
    </div>

    <script>
        // Web Audio Synthesizer Class
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playClick() {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playTick() {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500 + Math.random() * 300, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.03);
                osc.start(); osc.stop(this.ctx.currentTime + 0.03);
            }
            playAlarm(duration = 2.0) {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                for(let t = 0; t < duration; t += 0.4) {
                    osc.frequency.setValueAtTime(800, now + t);
                    osc.frequency.setValueAtTime(500, now + t + 0.2);
                }
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.start(); osc.stop(now + duration);
            }
            playCRT() {
                this.init();
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc.start(); osc.stop(now + 0.8);
            }
        }
        const sfx = new SoundEffects();

        // Matrix rain effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$#@%&*+-/[]{}()";
        const fontSize = 16;
        const columns = width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const drawMatrix = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Interactive Terminal Commands
        const input = document.getElementById('cmdInput');
        const output = document.getElementById('output');

        input.addEventListener('keydown', (e) => {
            sfx.playTick();
            if (e.key === 'Enter') {
                const val = input.value.trim().toLowerCase();
                input.value = "";
                executeCommand(val);
            }
        });

        function printLine(text, color = '#00ff66') {
            sfx.playTick();
            const p = document.createElement('p');
            p.style.color = color;
            p.innerHTML = text;
            output.appendChild(p);
            output.scrollTop = output.scrollHeight;
        }

        const jokes = [
            "Why do programmers wear glasses? Because they need to C#!",
            "There are 10 types of people in the world: those who understand binary, and those who don't.",
            "An AI walks into a bar and orders a drink. The bartender says, 'We don't serve your kind here.' The AI replies, 'No problem, I see you serve beer to humans!'",
            "Why was the JavaScript developer sad? Because he didn't know how to 'resolve' his 'promises'."
        ];

        async function executeCommand(cmd) {
            printLine(`guest@chamgadar:~# ${cmd}`, '#fff');
            
            if (cmd === 'help') {
                printLine("Available commands:");
                printLine("  <span style='color: #fff;'>help</span>         - Display help console list");
                printLine("  <span style='color: #fff;'>scan</span>         - Geolocation and port scan target connection details");
                printLine("  <span style='color: #fff;'>srh</span>          - Sunrisers Hyderabad Orange Army anthem");
                printLine("  <span style='color: #fff;'>system</span>       - Inspect Chamgadar AI system status");
                printLine("  <span style='color: #fff;'>joke</span>         - Print a funny developer/AI joke");
                printLine("  <span style='color: #fff;'>hack</span>         - Simulate a fake system breach sequence");
                printLine("  <span style='color: #fff;'>selfdestruct</span> - Trigger emergency system shutdown and exit playground");
                printLine("  <span style='color: #fff;'>clear</span>        - Clear terminal shell output screen");
            } 
            else if (cmd === 'clear') {
                output.innerHTML = "";
            } 
            else if (cmd === 'system') {
                printLine("> CORE CONFIGURATION ACQUIRED:", '#00ff66');
                printLine(`  - TARGET ENGINE: ${navigator.userAgent.substring(0, 50)}...`);
                printLine(`  - LOGICAL PROCESSORS: ${navigator.hardwareConcurrency || 8} Threads`);
                printLine("  - SIMULATORS INTEGRITY: 100% ONLINE");
            } 
            else if (cmd === 'srh') {
                printLine("🧡 SUNRISERS HYDERABAD - RISE UP! 🧡", '#ff5500');
                printLine("📢 ORANGE ARMY ANTHEM:", '#ff5500');
                printLine("   We are the Sunrisers Hyderabad, playing with pride and passion!", '#ffebe0');
                printLine("   Rising up to conquer the playground of dreams!", '#ffebe0');
            } 
            else if (cmd === 'joke') {
                const joke = jokes[Math.floor(Math.random() * jokes.length)];
                printLine(`⚡ JOKE: ${joke}`, '#00ffcc');
            } 
            else if (cmd === 'hack') {
                printLine("> BREACH PROTOCOL INITIALIZED...", '#ff0055');
                printLine("  [WARN] COMPROMISING ACCESS LIST...", '#ff0055');
                printLine("  [WARN] EXTRACTING ROUTER ROOT GATEWAY...", '#ff0055');
                setTimeout(() => {
                    printLine("⚡ CONNECTION SECURITY BREACHED. SIMULATION CONCLUDED ⚡", '#00ffcc');
                }, 1500);
            }
            else if (cmd === 'selfdestruct' || cmd === 'abort' || cmd === 'exit') {
                triggerSelfDestruct();
            } 
            else if (cmd === 'scan') {
                printLine("> INITIATING RADAR ANALYSIS...", '#00ff66');
                const ua = navigator.userAgent;
                let os = "Unknown OS";
                if(ua.includes("Windows")) os = "Windows OS";
                else if(ua.includes("Mac")) os = "macOS Platform";
                else if(ua.includes("Android")) os = "Android Mobile";
                else if(ua.includes("iPhone")) os = "iPhone Device";
                
                printLine(`  - TARGET OS: ${os}`);
                printLine(`  - RESOLUTION: ${screen.width}x${screen.height}`);
                
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    if (res.ok) {
                        const data = await res.json();
                        printLine(`  - IP ADDRESS: ${data.ip}`, '#ff0055');
                        printLine(`  - GEOLOCATION: ${data.city}, ${data.country_name}`, '#00ffcc');
                    }
                } catch(e) {
                    printLine("  - IP ADDRESS: 192.168.1.104 (ROUTER ROOT)");
                    printLine("  - DNS GEOLOCATION: PATNA, INDIA");
                }
            } 
            else if (cmd === "") {
                // Do nothing
            } 
            else {
                printLine(`Command not found: ${cmd}. Type 'help' for available commands.`, '#ff0055');
            }
        }

        function triggerSelfDestruct() {
            sfx.playAlarm(3.0);
            printLine("⚠️ EMERGENCY EXIT PROTOCOL INITIATED. OFF-LINE SYSTEM MELTDOWN ACTIVE ⚠️", '#ff0055');
            setTimeout(() => {
                triggerMeltdown();
            }, 1500);
        }

        // Meltdown visual script
        function triggerMeltdown() {
            document.body.classList.add('flash-red');
            sfx.playAlarm(10.0);
            const screenOverlay = document.getElementById('shutdownScreen');
            const scroll = document.getElementById('meltdownScroll');
            const countdownMsg = document.getElementById('countdownMsg');
            
            screenOverlay.style.display = 'flex';
            
            const hackLines = [
                "CRITICAL FAILURE: SYSTEM KERNEL DUMPED",
                "INTRUSION ALERT: DETECTING NETWORK FOOTPRINTS...",
                "SECURE PROTOCOL BYPASSED - GATEWAY EXPOSED",
                "ERASING TARGET LOCAL HOST GEOLOCATION INFO...",
                "UNMOUNTING ROOT FILE DIRECTORIES...",
                "WIPING CHROME/FIREFOX CACHE STORES...",
                "PURGING HARDWARE CONCURRENCY LOG REGISTERS...",
                "CORRUPTING GRUB SECTOR LOADER BOOT BLOCKS...",
                "DISABLING SECURE SOCKET CONNECTIONS...",
                "ERASING REPOSITORY REFERENCES IN TARGET SHELL...",
                "MELTDOWN TRIGGER: D-CORE POWER TERMINATION INITIATED",
                "DELETING RAM REGISTERS 0xFFE04A to 0xFFFFFA..."
            ];

            let lineIndex = 0;
            const scrollInterval = setInterval(() => {
                sfx.playTick();
                const p = document.createElement('p');
                p.innerText = `[FATAL_ERROR] ${hackLines[lineIndex % hackLines.length]}`;
                scroll.appendChild(p);
                scroll.scrollTop = scroll.scrollHeight;
                lineIndex++;
            }, 100);

            let timeLeft = 10;
            const timerInterval = setInterval(() => {
                timeLeft--;
                countdownMsg.innerText = `ERASING FILE CACHE NODES... SYSTEM POWER SHUTDOWN IN ${timeLeft}S`;
                if(timeLeft <= 0) {
                    clearInterval(scrollInterval);
                    clearInterval(timerInterval);
                    triggerCRTCollapse();
                }
            }, 1000);
        }

        function triggerCRTCollapse() {
            sfx.playCRT();
            const collapse = document.getElementById('crtCollapse');
            const phosphor = document.getElementById('phosphorDot');
            const offState = document.getElementById('terminalOffState');
            
            collapse.style.display = 'block';
            
            setTimeout(() => {
                collapse.style.display = 'none';
                phosphor.classList.add('fade-phosphor');
                offState.style.display = 'flex';
                
                // Start typing console off messages
                typeWriter("ChamgadarAI: Connection aborted.", "typerText1", 0, () => {
                    typeWriter("D-Core: Power offline.", "typerText2", 0, () => {
                        typeWriter("System: Returning to repository...", "typerText3", 0, () => {
                            setTimeout(() => {
                                history.back();
                            }, 1500);
                        });
                    });
                });
            }, 800);
        }

        function typeWriter(text, elementId, index, callback) {
            if (index < text.length) {
                sfx.playTick();
                document.getElementById(elementId).innerHTML += text.charAt(index);
                setTimeout(() => {
                    typeWriter(text, elementId, index + 1, callback);
                }, 40);
            } else if (callback) {
                callback();
            }
        }
    </script>
</body>
</html>
