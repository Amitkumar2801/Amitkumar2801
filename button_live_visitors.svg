<svg xmlns="http://www.w3.org/2000/svg" width="320" height="60" viewBox="0 0 320 60">
  <defs>
    <!-- Glowing Neon Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- 3D Button Gradient -->
    <linearGradient id="btn-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a124d" />
      <stop offset="50%" stop-color="#190a33" />
      <stop offset="100%" stop-color="#0c0419" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- 3D Deep Drop Shadow -->
  <rect x="6" y="8" width="308" height="48" rx="10" fill="#000000" opacity="0.75" />
  
  <!-- 3D Pushable Base Bevel Edge -->
  <rect x="4" y="6" width="312" height="50" rx="10" fill="#ff007f" />

  <!-- Main Button Body -->
  <rect x="4" y="4" width="312" height="48" rx="9" fill="url(#btn-fill)" stroke="url(#border-grad)" stroke-width="2.5" filter="url(#neon-glow)" />

  <!-- 3D Glass Top Gloss Reflection -->
  <path d="M 6 6 L 314 6 L 314 20 Q 160 26 6 20 Z" fill="#ffffff" opacity="0.14" />

  <!-- Left Glowing HIT Badge -->
  <rect x="12" y="14" width="46" height="28" rx="6" fill="#ff007f" filter="url(#neon-glow)" />
  <text x="35" y="32" fill="#ffffff" font-family="'JetBrains Mono', 'Impact', Arial Black, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">HIT</text>

  <!-- Main Button Headline -->
  <text x="68" y="27" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="0.5">CLICK / HIT FOR LIVE RADAR</text>
  
  <!-- Sub-headline with Live Pulse Indicator -->
  <circle cx="73" cy="39" r="3.5" fill="#00ffcc" filter="url(#neon-glow)" />
  <text x="82" y="43" fill="#00ffcc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" letter-spacing="1">REAL-TIME RUNNING PEOPLE ⚡</text>

  <!-- Right Play Arrow -->
  <polygon points="296,22 306,28 296,34" fill="#00ffcc" filter="url(#neon-glow)" />
</svg>
