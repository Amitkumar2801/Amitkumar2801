<svg xmlns="http://www.w3.org/2000/svg" width="260" height="54" viewBox="0 0 260 54">
  <defs>
    <!-- Glowing filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="btn-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="100%" stop-color="#080710" />
    </linearGradient>
  </defs>

  <!-- Button border with neon cyan glow -->
  <rect x="2" y="2" width="256" height="50" rx="8" fill="url(#btn-gradient)" stroke="#00ffcc" stroke-width="2.5" filter="url(#neon-glow)" />
  
  <!-- Glossy overlay reflection for real button 3D depth -->
  <path d="M4 4 h252 v16 c-10 8 -242 8 -252 0 z" fill="#ffffff" opacity="0.12" />

  <!-- Glowing Radar Play Icon -->
  <polygon points="24,18 24,36 40,27" fill="#00ffcc" filter="url(#neon-glow)" />

  <!-- Main Button Text -->
  <text x="50" y="29" fill="#ffffff" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="1">LIVE VISITOR RADAR</text>
  
  <!-- Interactive Call-To-Action subtext -->
  <text x="50" y="42" fill="#00ffcc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1.5">● CLICK TO LAUNCH APP ↗</text>
</svg>
