<svg xmlns="http://www.w3.org/2000/svg" width="220" height="28" viewBox="0 0 220 28">
  <defs>
    <linearGradient id="grad-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e0b1a" />
      <stop offset="100%" stop-color="#18122b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Button Background & Border -->
  <rect x="1" y="1" width="218" height="26" rx="4" fill="url(#grad-btn)" stroke="#00ffcc" stroke-width="1.5" filter="url(#glow)" />
  
  <!-- Subtle highlight shine -->
  <path d="M 2 2 L 218 2 L 218 8 Q 110 14 2 8 Z" fill="#ffffff" opacity="0.06" />

  <!-- Radar pulse circle icon -->
  <circle cx="16" cy="14" r="4" fill="#00ffcc" filter="url(#glow)" />
  <circle cx="16" cy="14" r="7" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.6" />

  <!-- Text -->
  <text x="32" y="18" fill="#00ffcc" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="800" letter-spacing="1">LIVE VISITOR RADAR</text>

  <!-- Forward Arrow -->
  <path d="M 198 10 L 204 14 L 198 18" fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
